services:
  mobysync:
    image: mobysync:latest
    container_name: mobysync
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      TZ: "Europe/Athens"
      API_KEY: "super-secret-key"
      PRUNE_IMAGES: "true"
      UPDATE_HOUR: "23"
      UPDATE_MINUTE: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock      
      - ~/.docker/config.json:/app/creds/config.json:ro