services:
  mobysync:
    image: steliosbairam/mobysync:latest
    container_name: mobysync
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      TZ: "Europe/Athens"
      API_KEY: "super-secret-key"
      # Comma-separated container names to skip (e.g. "db,redis"). All other running containers are monitored.
      EXCLUDED_CONTAINERS: ""
      # Discord embed webhook
      DISCORD_WEBHOOK_URL: ""
      # Generic JSON webhook (works with n8n, Zapier, custom endpoints, etc.)
      WEBHOOK_URL: ""
      # Set to "true" to remove dangling images from Docker after each update cycle
      PRUNE_IMAGES: "false"
      UPDATE_HOUR: 23
      UPDATE_MINUTE: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock      
      - ~/.docker/config.json:/app/creds/config.json:ro